<!doctype html>
<html>
<head>
    <title>Terminal</title>
    <!-- 1. Define the Font -->
    <style>
        @font-face {
            font-family: 'JetBrainsMono NF';
            src: url('JetBrainsMonoNerdFontMono-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        /* 2. Force Terminal to use it */
        .xterm-viewport, .xterm-screen {
            font-family: 'JetBrainsMono NF', monospace !important;
        }
    </style>
</head>
<body>
    <!-- ttyd will inject the terminal here -->
    <div id="terminal"></div>
    
    <!-- ttyd script (automatically provided by the binary) -->
    <script src="ttyd.js"></script>
</body>
</html>
